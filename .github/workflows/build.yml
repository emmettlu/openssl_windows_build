name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    env:
      PROJECT_REPOSITORY: openssl/openssl
      PROJECT_VERSION: openssl-3.5.5
      PROJECT_PATH: openssl
      PROJECT_BIN: openssl
      OPENSSL_INSTALL: OPENSSL_INSTALL
    strategy:
      matrix:
        os: [windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows Config
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout ${{ env.PROJECT_PATH }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PROJECT_REPOSITORY }}
          ref: refs/tags/${{ env.PROJECT_VERSION }}
          path: ${{ env.PROJECT_PATH }}

      # - name: Setup Strawberry Perl
      #   shell: pwsh
      #   run: |
      #     $perlUrl = "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54201_64bit/strawberry-perl-5.42.0.1-64bit-portable.zip"
      #     $zipPath = "$env:GITHUB_WORKSPACE\strawberry-perl.zip"
      #     $tempDir = "$env:GITHUB_WORKSPACE\perl_tmp"
      #     $perlDir = "$env:GITHUB_WORKSPACE\PERL"

      #     Invoke-WebRequest -Uri $perlUrl -OutFile $zipPath
      #     if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
      #     if (Test-Path $perlDir) { Remove-Item $perlDir -Recurse -Force }

      #     Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
      #     $root = Get-ChildItem -Path $tempDir | Where-Object { $_.PSIsContainer } | Select-Object -First 1
      #     Move-Item -Path $root.FullName -Destination $perlDir

      #     Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\PERL\perl\bin"

      - name: Setup NASM
        shell: pwsh
        run: |
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $zipPath = "$env:GITHUB_WORKSPACE\nasm.zip"
          $tempDir = "$env:GITHUB_WORKSPACE\nasm_tmp"
          $nasmDir = "$env:GITHUB_WORKSPACE\NASM"

          Invoke-WebRequest -Uri $nasmUrl -OutFile $zipPath
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          if (Test-Path $nasmDir) { Remove-Item $nasmDir -Recurse -Force }

          Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
          $root = Get-ChildItem -Path $tempDir | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          Move-Item -Path $root.FullName -Destination $nasmDir

          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\NASM"

      - name: Perl configure
        shell: cmd
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          perl.exe Configure VC-WIN64A shared --prefix=%GITHUB_WORKSPACE%\%PROJECT_PATH%\%OPENSSL_INSTALL%

      - name: Build
        shell: cmd
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          nmake /NOLOGO CFLAGS="/arch:AVX2 /MD /MP /Oi /Os /Gy /GL /Gw /fp:fast /GR- /GS-" LDFLAGS="/LTCG /OPT:REF /OPT:ICF" install

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PROJECT_BIN }}_${{ runner.os }}
          path: |
            ${{ env.PROJECT_PATH }}/${{ env.OPENSSL_INSTALL }}/
